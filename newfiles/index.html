<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#35261e">
  <title>MySuite — Sign in</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="shared/base.css?v=695979e8e412">
  <link rel="stylesheet" href="portal.css">
  <script src="shared/icons.js" defer></script>
  <script src="shared/mockdata.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      renderIcons();
      applyPortalAccounts();
    });
  </script>
</head>
<body>
  <main class="portal">
    <div class="portal-card">
      <p class="portal-eyebrow">BUILDING PORTAL</p>
      <h1 class="portal-brand">MySuite<span>.</span></h1>
      <p class="portal-lead">Choose your role to open your portal.</p>

      <div class="portal-roles" role="navigation" aria-label="Portal role selection">
        <a class="portal-role" href="resident/">
          <span class="portal-role-icon"><i data-icon="home"></i></span>
          <span>
            <strong>Resident</strong>
            <small data-portal-role="resident"></small>
          </span>
          <i data-icon="chevron"></i>
        </a>

        <a class="portal-role" href="board/">
          <span class="portal-role-icon"><i data-icon="board"></i></span>
          <span>
            <strong>Board member</strong>
            <small data-portal-role="board"></small>
          </span>
          <i data-icon="chevron"></i>
        </a>

        <a class="portal-role" href="concierge/">
          <span class="portal-role-icon"><i data-icon="key"></i></span>
          <span>
            <strong>Concierge</strong>
            <small data-portal-role="concierge"></small>
          </span>
          <i data-icon="chevron"></i>
        </a>

        <a class="portal-role" href="manager/">
          <span class="portal-role-icon"><i data-icon="clipboard"></i></span>
          <span>
            <strong>Manager</strong>
            <small data-portal-role="manager"></small>
          </span>
          <i data-icon="chevron"></i>
        </a>

        <a class="portal-role" href="technician/">
          <span class="portal-role-icon"><i data-icon="wrench"></i></span>
          <span>
            <strong>Technician</strong>
            <small data-portal-role="technician"></small>
          </span>
          <i data-icon="chevron"></i>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
