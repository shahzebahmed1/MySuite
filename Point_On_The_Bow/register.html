<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Registration - Point on the Bow</title>
    <meta http-equiv="refresh" content="0; url=login.html?register=true">
    <script>
        // Redirect to login page with registration form visible
        window.location.href = 'login.html?register=true';
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
        }
        .redirect-message {
            text-align: center;
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <p>Redirecting to registration page...</p>
        <p>If you are not redirected automatically, <a href="login.html?register=true">click here</a>.</p>
    </div>
</body>
</html>
